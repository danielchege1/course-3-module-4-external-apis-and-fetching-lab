<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Alerts App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Weather Alerts App</h1>
  <label for="state-input">U.S. state abbreviation (for example, NY)</label>
  <input type="text" id="state-input" placeholder="Enter state abbreviation" maxlength="2" autocomplete="off">
  <button id="fetch-alerts">Get Weather Alerts</button>
  <div id="alerts-display" aria-live="polite"></div>
  <div id="error-message" class="hidden" role="alert"></div>
  <script src="./index.js"></script>
</body>
</html>
